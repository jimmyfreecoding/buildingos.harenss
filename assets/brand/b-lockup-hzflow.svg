<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="H2Z Tech alternative B — H to Z flow">
  <title>备选 B — H→Z 流动（H 到 Z，端到端；箭头即 "2/to"）</title>
  <!-- H -->
  <rect x="40" y="40" width="16" height="120" fill="#0A1A2F"/>
  <rect x="84" y="40" width="16" height="120" fill="#0A1A2F"/>
  <rect x="40" y="92" width="60" height="16" fill="#0A1A2F"/>
  <!-- arrow (the "2" / "to") -->
  <line x1="118" y1="100" x2="154" y2="100" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
  <polygon points="152,84 180,100 152,116" fill="#F59E0B"/>
  <!-- Z -->
  <rect x="198" y="40" width="64" height="16" fill="#0A1A2F"/>
  <line x1="262" y1="56" x2="198" y2="144" stroke="#0A1A2F" stroke-width="16"/>
  <rect x="198" y="144" width="64" height="16" fill="#0A1A2F"/>
  <!-- wordmark -->
  <text x="300" y="95" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#0A1A2F" letter-spacing="1">H<tspan fill="#F59E0B" font-size="34" dy="-13">2</tspan><tspan dy="13">Z</tspan></text>
  <text x="415" y="95" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#F59E0B" letter-spacing="4">TECH</text>
  <text x="302" y="134" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="3.2">CCTV · NETWORKS · AI MONITORING</text>
</svg>
