# 凭据引用表 —— 这里只有「引用名」，永远没有明文
#
# 三层凭据架构：
#   ① 加密存储：本地 Vault（AES-GCM，密钥由主口令 KDF 派生）或 DSH credentials 的 file 层
#   ② 引用注入：本文件 + cordis.yml + 代码里只出现引用名
#   ③ 凭据代理：CredentialBroker 在内存中完成认证；模型/工作流/日志永不接触明文
#
# VAULT:// 语法：VAULT://<site>/<target>[/<field>]
# 轮换：DSH credentials 每次操作重新解析引用，改密码后下一次请求即生效，无需重启。

refs:
  gateway:              { vault: "VAULT://home-01/gateway",            fields: [username, password], rotate_days: 180, note: "Xfinity 网关本地管理员" }
  h3c-ap:               { vault: "VAULT://home-01/h3c-ap",             fields: [username, password], rotate_days: 180 }
  cam-hikvision-119:    { vault: "VAULT://home-01/cam-hikvision-119",  fields: [username, password], auth: digest, rotate_days: 365 }
  cam-tapo-177:         { vault: "VAULT://home-01/cam-tapo-177",       fields: [username, password], auth: klap,   rotate_days: 365 }
  cam-tapo-094:         { vault: "VAULT://home-01/cam-tapo-094",       fields: [username, password], auth: klap,   rotate_days: 365 }
  nvr-251:              { vault: "VAULT://home-01/nvr-251",            fields: [ssh_key_ref], type: ssh-key }
  snmp-ro:              { vault: "VAULT://home-01/snmp-ro",            fields: [community], note: "只读 community；交换机/AP 采集用" }
  git-deploy-key:       { vault: "VAULT://home-01/git-deploy-key",     fields: [private_key], type: ssh-key, scope: "read-only for appliance" }

# 凭据代理允许的动作白名单（超出即拒绝，需要人工介入）
broker_policy:
  allow_actions:
    - read-config          # 只读采集配置
    - read-status
    - change-wifi-channel  # 仅限 ap 角色
    - change-camera-bitrate
    - restart-iot
  deny_actions:
    - access-control-open-door   # 远程开门：永久禁止
    - firewall-allow-rule        # 防火墙放行：仅出建议
    - factory-reset
    - change-wan-config
  audit: true
  max_concurrent: 2
