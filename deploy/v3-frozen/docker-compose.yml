# NetOps 一体机 —— 冻结版编排
#
# 启动：cp .env.example .env && 填好引用名 && docker compose up -d
# 目标机：树莓派 5 / 8GB + NVMe、x86 迷你主机、或笔记本
#
# 两条硬约束：
#   1) probe 与 harness 都必须是 host 网络 + NET_RAW/NET_ADMIN —— 它们要发广播、
#      做 ARP/端口扫描、拉 RTSP。区别只有一个：harness 有 LLM 参与，probe 没有。
#   2) 两者都必须显式声明出口接口（NETOPS_EGRESS_IFACE），否则广播/组播会被
#      VirtualBox / Wi-Fi Direct 这类低度量虚拟网卡抢走，发现会静默失败。

name: netops

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

# 特权只读容器（probe / harness 共用）
x-netpriv: &netpriv
  network_mode: host
  cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]

services:
  # ─────────────────────────── 存储 ───────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: netops
      POSTGRES_USER: netops
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./secrets/pg_password:/run/secrets/pg_password:ro
      - ../packages/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports: ["127.0.0.1:5432:5432"]        # 只对宿主开放，供 host 网络的 harness 用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops -d netops"]
      interval: 10s
      retries: 10

  tdengine:
    image: tdengine/tdengine:3.3.0.0
    <<: [*restart, *logging]
    environment:
      TAOS_FQDN: tdengine
    volumes:
      - taos-data:/var/lib/taos
      - taos-log:/var/log/taos
    ports:
      - "127.0.0.1:6041:6041"             # taosAdapter REST
      - "127.0.0.1:6030:6030"
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases;' || exit 1"]
      interval: 15s
      retries: 10

  mqtt:
    image: emqx/emqx:5.8
    <<: [*restart, *logging]
    environment:
      EMQX_NODE__NAME: emqx@netops
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MQTT_DASHBOARD_PASSWORD:?see .env}
    volumes: [emqx-data:/opt/emqx/data]
    ports:
      - "127.0.0.1:1883:1883"             # 探针与 harness 走宿主回环
      - "18083:18083"                     # Dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      retries: 10

  # ─────────────────────────── 采集（无 LLM）───────────────────
  probe:
    build: ../apps/probe
    <<: [*restart, *logging, *netpriv]
    environment:
      NETOPS_SITE: ${SITE_ID:?}
      NETOPS_PROBE_ID: ${PROBE_ID:-probe-01}
      NETOPS_EGRESS_IFACE: ${NETOPS_EGRESS_IFACE:?e.g. eth0}
      NETOPS_MQTT_URL: mqtt://127.0.0.1:1883
      NETOPS_INTERVAL_S: ${PROBE_INTERVAL_S:-300}
      NETOPS_SCAN_SCOPE_FILE: /etc/netops/scan-scope.yml
      TZ: ${NETOPS_TZ:-Asia/Shanghai}
    volumes:
      - ../config/scan-scope.yml:/etc/netops/scan-scope.yml:ro
      - probe-pcap:/var/lib/netops/pcap
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M }

  # ─────────────────────────── 决策（DSH）─────────────────────
  harness:
    build: ../harness/service
    <<: [*restart, *logging, *netpriv]
    environment:
      DSH_HOME: /data/dsh
      NETOPS_SITE: ${SITE_ID:?}
      NETOPS_EGRESS_IFACE: ${NETOPS_EGRESS_IFACE:?}
      NETOPS_API_URL: http://127.0.0.1:8080
      NETOPS_TD_URL: http://127.0.0.1:6041
      NETOPS_MQTT_URL: mqtt://127.0.0.1:1883
      NETOPS_PG_DSN_REF: ${NETOPS_PG_DSN_REF:-NETOPS_PG_DSN}
      DSH_LLM_KEY_REF: ${DSH_LLM_KEY_REF:?}
      NETOPS_TOOLBOX_DIR: /opt/netops/harness/toolbox
      NETOPS_TOOLBOX_WRITABLE: "1"        # 允许模型造工具
    volumes:
      - dsh-home:/data/dsh
      - ../harness/profile:/opt/netops/harness/profile:ro
      - ../harness/plugins:/opt/netops/harness/plugins:ro
      - ../harness/toolbox:/opt/netops/harness/toolbox   # 模型写入
      - ../harness/adapters:/opt/netops/harness/adapters # 人审通过
    ports: ["127.0.0.1:8090:8090"]        # harness-service HTTP/WS
    depends_on:
      postgres: { condition: service_healthy }
      tdengine: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2560M }

  # ─────────────────────────── 应用 ───────────────────────────
  api:
    build: ../apps/api
    <<: [*restart, *logging]
    environment:
      NETOPS_SITE: ${SITE_ID:?}
      NETOPS_PG_DSN: postgres://netops@postgres:5432/netops
      NETOPS_TD_URL: http://tdengine:6041
      NETOPS_MQTT_URL: mqtt://mqtt:1883
      NETOPS_HARNESS_URL: http://127.0.0.1:8090     # host 网络服务，走宿主回环
      NETOPS_GIT_REMOTE: ${CUSTOMER_GIT_REMOTE:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      tdengine: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      retries: 10

  web:
    build: ../apps/web
    <<: [*restart, *logging]
    environment:
      NETOPS_API_URL: http://api:8080
    ports: ["80:80"]
    depends_on: [api]

  worker:
    build: ../apps/worker
    <<: [*restart, *logging]
    environment:
      NETOPS_API_URL: http://api:8080
      NETOPS_HARNESS_URL: http://127.0.0.1:8090
      NETOPS_MQTT_URL: mqtt://mqtt:1883
      NETOPS_TZ: ${NETOPS_TZ:-Asia/Shanghai}
      REPORT_DAILY_CRON: ${REPORT_DAILY_CRON:-0 7 * * *}
      REPORT_WEEKLY_CRON: ${REPORT_WEEKLY_CRON:-0 7 * * 1}
    depends_on:
      api: { condition: service_healthy }
    # 任务队列一次只跑 1 个 harness 任务（见 DECISIONS D13）

  # 客户不允许配置出公网 Git 时启用
  gitea:
    image: gitea/gitea:1.22
    <<: [*restart, *logging]
    profiles: ["selfhosted-git"]
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: netops
      GITEA__database__USER: netops
    volumes: [gitea-data:/data]
    ports: ["3000:3000", "2222:22"]

volumes:
  pg-data:
  taos-data:
  taos-log:
  emqx-data:
  probe-pcap:
  dsh-home:
  gitea-data:
