# BuildingOS dev environment — reference compose (M1.5 ②).
# This is the template `buildingos init` writes into a tenant directory as
# docker-compose.yml. It is SELF-CONTAINED: it references the
# buildingos-runtime:dev image by name — no tool-repo path, no required env var.
#
#   cd my-tenant && docker compose up
#
# Build the runtime image first (once) from the tool repo, or let `buildingos dev`
# do it automatically:
#   docker build -t buildingos-runtime:dev -f deploy/Dockerfile <tool-repo>
# Mounts the tenant workspace at /workspace (the CLI inside operates on it).
name: buildingos-dev

services:
  buildingos-runtime:
    image: buildingos-runtime:dev
    container_name: buildingos-runtime
    working_dir: /workspace
    # Keep the container alive; work inside it via: docker compose exec buildingos-runtime buildingos <cmd>.
    entrypoint: ['sleep', 'infinity']
    volumes:
      - .:/workspace
    environment:
      - BUILDINGOS_WORKSPACE=/workspace
      - MODEL_TOKEN=${MODEL_TOKEN:-}
      - GIT_TOKEN=${GIT_TOKEN:-}
    stdin_open: true
    tty: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: buildingos-postgres
    environment:
      POSTGRES_USER: buildingos
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: buildingos
    ports:
      - '${PG_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
