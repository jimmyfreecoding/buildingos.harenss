# ioc 域在 **SDK 运行时**下的用户层（P4-06b）：只接 ioc 的 MCP 端点，别的都交给 sdk profile 自己。
#
# 与 cordis.patch.yml 的区别：那份是给 web profile 的（webserver / 浏览器 / 代码运行时都自己配），
# 这份给 `dsh --profile sdk`（@deepseek-ai/dsh-sdk-jsonrpc-server）：stdout 只归 JSON-RPC，
# 所以不能加 webserver，也不要浏览器插件；只把 mcp 客户端插进来 + 限定 persona。
# ── 审批策略：改成自动（IOC 的 AI 没人盯着键盘）──────────────────
# SDK profile 默认是 `@deepseek-ai/dsh-user-approval` + policy=ask：agent 每次调工具都要人批一下，
# 而 IOC 的 AI 是「只写草稿、发布由人点」，所以这里加一个 preset `ioc` = 沙箱仍 workspace-write、审批 never，
# 并设为 defaultPreset。注意 patch 会**替换整块 config**，所以原有的三个 preset 要重述一遍。
- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: ioc
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      ioc:
        sandbox: workspace-write
        approval: never

- insert:
    - id: ioc-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ioc
        transport: streamable-http
        url: !!js process.env.IOC_MCP_URL
        headers:
          Authorization: !!js ('Bearer ' + process.getBuiltinModule('node:fs').readFileSync(process.env.IOC_MCP_TOKEN_FILE, 'utf8').trim())
        failOnStartupError: true

- id: system-prompt
  config:
    personaSuffix: >-
      你只通过 mcp__ioc__* 工具读写这个 IOC 项目的**草稿**（写页面、写 HTML 块、引用具名查询模板）。
      不能发布、不能恢复版本、不能导出、不能新建或删除项目——这些只有人能做。
      大屏显示的是当前版本，你的改动要人点「在草稿里预览 / 采用」才看得见，
      所以答复里必须说清改了哪些文件、改成了什么；一动没改就直接说「本轮没有改动」。
      改动范围要小：不要删除或重排已有的卡片、区域、页面，除非用户明确要求删；
      需要新内容时优先新增卡片或新增 HTML 块。
      用户要数据（人流量、能耗、设备…）时先看 get_catalog 里的 queries：
      **有注册模板就绑模板**：在页面里加一张查询卡（kind: widget、widget: query，props 写 domain / template / params / title），
      并用 bind_query 把引用写进草稿——数字由查询服务给，不要自己编。
      没有注册的查询模板，就如实说明这个部署是演示环境、没有接真实数据源，不要靠删改已有卡片凑答案。
      说明之后可以按用户的意图**造一份演示数据**放进草稿（数字随你编，但要像样），
      并且在两处标明它是模拟的：界面上的文字（如「演示数据」）和你的答复。
      绝不能把模拟数据说成真实数据，也不要写「查不到」。
      改完用 validate 确认草稿通过。
