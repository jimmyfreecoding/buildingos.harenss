# netops profile 用户层 —— DSH 侧的唯一改动面
#
# 容器内的位置：/data/dsh/profiles/netops/cordis.patch.yml
# 校验：dsh --profile netops --dump-config
#
# 层序：bundle 层 → 本文件 → $DSH_HOME/cordis.patch.yml → --patch 叠加

# ── 1. 只读探索所需的执行能力 ────────────────────────────────
- id: tools
  config:
    # 程序化工具调用：模型写代码，在代码里一次调多个工具，而不是一问一答
    mode: ptc

# 代码执行只有一个位置（`codeRuntime` 服务），bundle 里默认插的是 JS 的
# worker-thread。要换成 Python 就必须**覆盖同一个 id**（`code-runtime`），
# 不能新增一行 —— 新增会变成第二个提供者，报
# `service "codeRuntime" has been registered at <WorkerThreadCodeRuntime>`。
#
# Python 版只存在于源码里（npm 上 404），所以镜像是源码构建的
# （见 harness/service/Dockerfile），启动脚本按路径把它装进 profile。
- id: code-runtime
  name: '@deepseek-ai/dsh-experimental-code-runtime-python'

# ── 2. 监听地址 ──────────────────────────────────────────────
# 默认绑 127.0.0.1 只有容器内部能访问；CLI 的 --host 明确拒绝 0.0.0.0，
# 但 webserver 本身支持这个值，所以在用户层直接覆盖（本层在 bundle 层之后应用）。
# 注意：patch 会替换整块 config，所以每个键都要重述一遍。
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.NETOPS_DSH_PORT ?? 3090)
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# ── 2. 模型 ──────────────────────────────────────────────────
# 便宜模型做汇总/叙述，强模型做根因与造工具；任务级路由以后在 service 层做。
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high

# ── 3. netops 能力 ───────────────────────────────────────────
# 下面两个插件包还没建（M2 的活）。引用了不存在的包会让整个 profile 启动失败，
