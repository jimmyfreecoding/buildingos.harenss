name: build

# 提交即构建。当前仓库的应用服务还在陆续落地，所以：
#   · 基础设施编排始终校验（配置写错立刻发现）
#   · apps/ 下凡是带 Dockerfile 的目录自动进构建矩阵 —— 新加一个应用不用改本文件
on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── 1. 校验编排与建表脚本，并发现需要构建的应用 ─────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 infra 编排
        run: docker compose -f deploy/docker-compose.infra.yml config --quiet

      - name: 校验完整编排（若已建立）
        run: |
          if [ -f deploy/docker-compose.yml ]; then
            docker compose -f deploy/docker-compose.yml config --quiet
          else
            echo "deploy/docker-compose.yml 尚未建立，跳过"
          fi

      - name: 校验建表脚本语法
        run: |
          set -e
          # 失败也要把容器收掉（--rm 只管"停止后删除"，失败时容器还在跑）
          trap 'docker rm -f pgcheck >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name pgcheck \
            -e POSTGRES_PASSWORD=x -e POSTGRES_DB=netops \
            postgres:16-alpine >/dev/null
          # postgres 镜像首次启动会先起一个**临时** server 跑 initdb，再停掉它起真 server。
          # 只看 pg_isready 会在临时期就返回成功，紧接着的 psql 就会撞上
          # "FATAL: terminating connection due to administrator command"（本机复现过：
          # 临时 server PID 54 ready → 55 shutting down → init process complete → 真 server PID 1）。
          # 所以要等两件事都成立：① initdb 结束（日志出现 "PostgreSQL init process complete"）；
          # ② 真 server 能接受连接（用一条真 SQL 探，而不是 pg_isready）。
          for i in $(seq 1 60); do
            if docker logs pgcheck 2>&1 | grep -q 'PostgreSQL init process complete'; then break; fi
            sleep 1
          done
          ready=0
          for i in $(seq 1 60); do
            if docker exec pgcheck psql -U postgres -d netops -tAc 'select 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "postgres 60 秒内没有接受连接，日志末尾："
            docker logs pgcheck 2>&1 | tail -30
            exit 1
          fi
          docker exec -i pgcheck psql -U postgres -d netops -v ON_ERROR_STOP=1 \
            < packages/db/schema.sql

      - name: 发现带 Dockerfile 的应用
        id: discover
        run: |
          apps=$(find apps -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null \
                 | xargs -r -n1 basename | sort -u \
                 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=${apps:-[]}" >> "$GITHUB_OUTPUT"
          echo "发现应用: ${apps:-[]}"

  # ── 2. 构建应用镜像 ────────────────────────────────────────
  build:
    needs: validate
    if: needs.validate.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.validate.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
